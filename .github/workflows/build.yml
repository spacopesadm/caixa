name: Gerar Painel do Caixa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install pyinstaller pystray pillow reportlab
      - name: Compilar o programa
        shell: bash
        run: |
          cp caixa.pyw caixa_main.py
          pyinstaller --noconfirm --onedir --windowed --name PainelDoCaixa \
            --hidden-import configuracoes --hidden-import relatorio --hidden-import envio --hidden-import nuvem \
            --collect-submodules reportlab --collect-data reportlab \
            caixa_main.py
      - name: Montar o zip
        shell: bash
        run: |
          mkdir -p pacote
          cp -r dist/PainelDoCaixa pacote/PainelDoCaixa
          cp COMECE-AQUI.txt LIDER.txt pacote/
          cd pacote && 7z a -tzip ../PainelDoCaixa.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: PainelDoCaixa
          path: PainelDoCaixa.zip
      - name: Publicar em Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" PainelDoCaixa.zip --title "Painel do Caixa v${{ github.run_number }}" --notes "Baixe o PainelDoCaixa.zip, extraia e abra o PainelDoCaixa.exe. Leia o COMECE-AQUI.txt."

  pagina-lider:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lider
      - id: deploy
        uses: actions/deploy-pages@v4
