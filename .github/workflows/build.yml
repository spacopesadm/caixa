name: Gerar Painel do Caixa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install pyinstaller pystray pillow reportlab qrcode
      - name: Compilar o programa (um único .exe)
        shell: bash
        run: |
          cp caixa.pyw caixa_main.py
          pyinstaller --noconfirm --onefile --windowed --name PainelDoCaixa \
            --hidden-import configuracoes --hidden-import relatorio --hidden-import envio --hidden-import nuvem \
            --collect-submodules reportlab --collect-data reportlab --collect-submodules qrcode \
            caixa_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PainelDoCaixa
          path: dist/PainelDoCaixa.exe
      - name: Publicar em Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" dist/PainelDoCaixa.exe --title "Painel do Caixa v${{ github.run_number }}" --notes "Baixe o PainelDoCaixa.exe e dê dois cliques. Ele se instala sozinho e abre com o Windows."

  pagina-lider:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lider
      - id: deploy
        uses: actions/deploy-pages@v4
